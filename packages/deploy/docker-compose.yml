services:
  agent-core:
    image: agent-core:latest
    build:
      context: ../..
      dockerfile: packages/deploy/Dockerfile
    ports:
      - "3000:3000"
    environment:
      AGENT_CORE_DATA: /data
      PORT: "3000"
      AGENT_CORE_MEMORY_MODE: http
      AUTOMEM_URL: http://automem:8000
      GRAPHITI_URL: http://graphiti:8000
    volumes:
      - agent-core-data:/data
    restart: unless-stopped
    depends_on:
      - automem
      - graphiti

  automem:
    image: ghcr.io/verygoodplugins/automem:latest
    restart: unless-stopped
    environment:
      AUTOMEM_API_TOKEN: ${AUTOMEM_API_TOKEN:-}
    volumes:
      - automem-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/changeme}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p changeme 'RETURN 1' || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10

  graphiti:
    image: zepai/graphiti:latest
    restart: unless-stopped
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: changeme
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GRAPHITI_GROUP_ID: ${GRAPHITI_GROUP_ID:-agent-core}
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  agent-core-data:
  automem-data:
  neo4j-data:
